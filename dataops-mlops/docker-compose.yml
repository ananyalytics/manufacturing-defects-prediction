name: capstone-mlops
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-dataops/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: "mlflow==2.14.1 scikit-learn==1.5.0 pandas==2.2.2"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./notebooks:/opt/airflow/notebooks
    - ./notebooks/mlruns:/tmp/notebooks/mlruns
  depends_on:
    - postgres-dataops

services:
  # ---------------- Module 2: Pipeline Orchestration ----------------
  postgres-dataops:
    image: postgres:15
    container_name: dataops_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-dataops-db:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    profiles: ["pipelines", "full"]

  airflow-init:
    <<: *airflow-common
    container_name: dataops_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    profiles: ["pipelines", "full"]

  airflow-webserver:
    <<: *airflow-common
    container_name: dataops_airflow_web
    command: webserver
    ports:
      - "8085:8080"
    depends_on:
      - airflow-init
    profiles: ["pipelines", "full"]

  airflow-scheduler:
    <<: *airflow-common
    container_name: dataops_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init
    profiles: ["pipelines", "full"]

  # ---------------- Module 3: Experiment Tracking ----------------
  mlflow:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/mlflow/mlflow:v2.14.1
        USER root
        RUN pip install --no-cache-dir --prefer-binary psycopg2-binary sqlalchemy
        ENTRYPOINT []
    container_name: dataops_mlflow
    volumes:
      - ./notebooks/mlruns:/tmp/notebooks/mlruns
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri /tmp/notebooks/mlruns --default-artifact-root /tmp/notebooks/mlruns --host 0.0.0.0 --port 5000
    profiles: ["full"]

  # ---------------- Module 4: Serving & Monitoring ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: dataops_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    profiles: ["full"]

  grafana:
    image: grafana/grafana:latest
    container_name: dataops_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["full"]

  fastapi-demo:
    build:
      context: ./fastapi-demo
    container_name: dataops_fastapi_demo
    volumes:
      - ./notebooks/mlruns:/tmp/notebooks/mlruns
    ports:
      - "8000:8000"
    profiles: ["full"]

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: dataops_jupyter
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "mlflow==2.14.1 scikit-learn==1.5.0 pandas==2.2.2"
    volumes:
      - ./notebooks:/home/jovyan/work
    ports:
      - "8889:8888"
    command: start-notebook.sh --NotebookApp.token='dataopsmlops2026'
    profiles: ["pipelines", "full"]

  dvc-tools:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir dvc==3.51.2
        WORKDIR /workspace
    container_name: dataops_dvc_tools
    volumes:
      - ./notebooks:/workspace
    command: tail -f /dev/null
    profiles: ["pipelines", "full"]

volumes:
  postgres-dataops-db: